<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewerTab</title>

    <style>
        [data-theme="navy"] {
            --bg: rgb(33, 33, 72);
            --bg2: rgb(46, 46, 105);
            --h1: rgb(165, 165, 225);
            --font: white;
            --family: Arial;
            --borderRadius: 16px;
            --gap: 12px;
            --select: rgb(0, 145, 189);
        }

        [data-theme="terminal"] {
            --bg: black;
            --bg2: rgb(30, 30, 30);
            --h1: rgb(0, 255, 0);
            --font: rgb(0, 255, 0);
            --family: monospace;
            --borderRadius: 0px;
            --gap: 12px;
            --select: white;
        }

        [data-theme="amberTerminal"] {
            --bg: black;
            --bg2: rgb(30, 30, 30);
            --h1: #ffb000;
            --font: #ffb000;
            --family: monospace;
            --borderRadius: 0px;
            --gap: 12px;
            --select: white;
        }

        [data-theme="sunset"] {
            --bg: rgb(43, 24, 36);
            --bg2: rgb(79, 41, 57);
            --h1: rgb(255, 154, 98);
            --font: rgb(255, 232, 214);
            --family: Georgia, serif;
            --borderRadius: 16px;
            --gap: 12px;
            --select: rgb(255, 214, 153);
        }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--font);
            font-family: var(--family);

            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            min-height: 100vh;
        }

        #info {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        /* #timeCont {
        } */

        #bigTime {
            font-size: 50px;
        }

        #shortcuts {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .shortcut {
            border: 2px solid var(--h1);
            padding: 5px;
            border-radius: var(--borderRadius);
            background-color: var(--bg2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shortcut:hover {
            border-color: var(--select);
        }

        .shortcut img {
            display: block;
            border-radius: var(--borderRadius);
        }

        #center {
            width: clamp(300px, 50vw, 800px);
            max-width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 2;
        }

        input {
            color: var(--font);
            font-family: var(--family);
        }

        #searchInput {
            display: block;
            box-sizing: border-box;
            width: 100%;
            border: 2px solid var(--h1);
            padding: 20px;
            font-size: 30px;
            border-radius: var(--borderRadius);
            background-color: var(--bg2);
            color: var(--font);
            font-family: var(--family);
        }

        #searchInput:hover, #searchInput:focus {
            outline: none;
            border: 2px solid var(--select);
        }

        #searchBottom {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px 20px;
            margin-top: 15px;
        }

        #searchBottom div {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        #searchBottom select,
        #searchBottom button {
            white-space: nowrap;
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
            padding: 10px 20px;
            background: var(--bg2);
            color: var(--font);
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
        }

        #searchBottom select {
            padding-right: 30px;
            appearance: none;
            -webkit-appearance: none;
        }

        #searchBottom button:hover,
        #searchBottom select:hover {
            border-color: var(--select);
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 12px;
            position: absolute;
            right: 15px; 
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none; 
        }

        .widget-grid {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            table-layout: fixed;
            border-collapse: collapse;
            border-spacing: 0;
            z-index: 1;
        }

        .widget-grid td {
            padding: 0px;
            border: none;
            position: relative;
        }

        .widget-inner {
            position: absolute;
            inset: calc(var(--gap) / 2);
            box-sizing: border-box;
            padding: 10px;
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
            background: var(--bg2);
            overflow: hidden;
        }

        .widget-inner button {
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
            background: var(--bg);
            color: var(--font);

            min-width: 0;
            padding: 4px 6px;
            font: inherit;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-inner .buttons {
            display: flex;
            gap: 4px;
            width: 100%;
            min-width: 0;
            flex-wrap: wrap;
        }

        .widget-inner button, .widget-inner input {
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
            background: var(--bg);
            color: var(--font);
            padding: 5px;
            text-align: center;
            font-size: 15px;
        }

        button:hover {
            cursor: pointer;
        }

        .task-check {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            margin: 0 8px 0 0;
            border: 1px solid var(--h1);
            border-radius: 4px;
            background: var(--bg2);
            cursor: pointer;
            vertical-align: middle;
            position: relative;
            transition: background 0.15s;
        }

        .task-check:checked {
            background: var(--h1);
        }

        /* .task-check:checked::after {
            content: "";
            position: absolute;
            left: 5px;
            top: -1px;
            width: 5px;
            height: 10px;
            border: solid var(--bg2);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        } */

        .task-check:focus-visible {
            outline: 2px solid var(--h1);
            outline-offset: 2px;
        }

        #top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        #settingsOverlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
        }

        #settingsOverlay[hidden] {
            display: none;
        }

        #settings {
            box-sizing: border-box;
            width: min(600px, 90vw);
            height: 50vh;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg2);
            color: var(--font);
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
        }

        #notch {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 14px;
            font-size: 18px;
            background: var(--bg2);
            border: 2px solid var(--h1);
            border-top: none;
            border-radius: 0 0 var(--borderRadius) var(--borderRadius);
        }

        #settingsButton {
            box-sizing: border-box;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
            border: 2px solid var(--h1);
            border-radius: calc(var(--borderRadius) / 2);
            background: var(--bg);
            color: var(--font);
            cursor: pointer;
            user-select: none;
        }

        #settingsButton:hover, button:hover, input:hover {
            border-color: var(--select);
        }

        .color-change-highlight:hover {
            color: var(--select) !important;
        }

        #themeSelector {
            display: flex;
            gap: 10px;
            padding: 10px;
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
        }

        .themeSelectorTheme {
            flex: 1;
            box-sizing: border-box;
            height: 15vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--bg);
            color: var(--font);
            font-family: var(--family);
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
            cursor: pointer;
        }

        .themeSelectorTheme .swatch {
            width: 60%;
            height: 20px;
            background: var(--bg2);
            border: 1px solid var(--h1);
            border-radius: calc(var(--borderRadius) / 2);
        }

        .themeSelectorTheme:hover {
            border-color: var(--select);
        }

        .themeSelectorTheme.selected {
            outline: 2px solid var(--select);
            outline-offset: 2px;
        }

        .flex-row {
            display: flex;
            flex-direction: row;
            gap: 5px;
        }

        textarea {
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
            padding: 5px;
            background-color: var(--bg);
            color: var(--font);
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
            height: 20vh;
            resize: vertical;
        }

        .flex-row button {
            border: 2px solid var(--h1);
            border-radius: var(--borderRadius);
            padding: 5px;
            background-color: var(--bg);
            color: var(--font)
        }
    </style>
</head>
<body>
    <div id="center">
        <div id="info">
            <div id="timeCont">
                <span id="bigTime">0:00</span>
                <span id="timeHalf">None</span>
            </div>
            <div id="dateInfo">
                <div id="weekDay">None</div>
                <div id="dateReadable">None None</div>
                <div id="dateNumbers">None/None/None</div>
            </div>
        </div>
        
        <div id="centerSearch">
            <form id="searchForm">
                <input id="searchInput" autofocus>
                <div id="searchBottom">
                    <div>
                        <div class="select-wrapper">
                            <select id="searchEngines">
                            </select>
                        </div>
                    </div>
                    <div>
                        <button>Search</button>
                        <button type="button" onclick="inNewTab();">Search in new tab</button>
                        <button type="button" id="firstResultBtn" onclick="firstResult();">First Result</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="shortcuts">
        </div>
    </div>

    <div id="top">
        <div id="notch">
            <div id="settingsButton">⚙︎</div>
            <div id="topTime">0:00 PM</div>
        </div>
    </div>

    <div id="settingsOverlay" hidden>
        <div id="settings">
            <h1>Settings</h1>

            <h2>Theme</h2>
            <div id="themeSelector"></div>

            <h2>Export</h2>
            <textarea id="export"></textarea>
            <div class="flex-row">
                <button id="exportCopy">Copy</button>
            </div>

            <h2>Import</h2>
            <textarea id="import"></textarea>
            <div class="flex-row">
                <button id="importButton">Import</button>
                <span id="importMessage"></span>
            </div>
        </div>
    </div>

    <script>
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");

        const bigTime = document.getElementById("bigTime");
        const weekDay = document.getElementById("weekDay");
        const dateReadable = document.getElementById("dateReadable");
        const dateNumbers = document.getElementById("dateNumbers");
        const timeHalf = document.getElementById("timeHalf");

        const searchEnginesSelect = document.getElementById("searchEngines");
        const firstResultBtn = document.getElementById("firstResultBtn");

        const shortcutsBox = document.getElementById("shortcuts");

        const settingsButton = document.getElementById("settingsButton");
        const settingsOverlay = document.getElementById("settingsOverlay");
        const settings = document.getElementById("settings");
        const themeSelector = document.getElementById("themeSelector");

        const topTime = document.getElementById("topTime");
        const exportElem = document.getElementById("export");
        const exportCopy = document.getElementById("exportCopy");

        const importElem = document.getElementById("import");
        // const importPaste = document.getElementById("importPaste");
        const importButton = document.getElementById("importButton");
        const importMessage = document.getElementById("importMessage");

        function copy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                const msg = successful ? 'successful' : 'unsuccessful';
                console.log('Fallback: Copying text command was ' + msg);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }

            document.body.removeChild(textArea);
        }

        exportElem.addEventListener("keypress", (e) => {
            e.preventDefault();
        })

        exportCopy.addEventListener("click", () => {
            copy(exportElem.value);
            exportCopy.innerText = "Copied!";
            setInterval(() => { exportCopy.innerText = "Copy" }, 600);
        })

        function validateImport(data) {
            if (!data || typeof data !== "object" || Array.isArray(data)) {
                return "Expected a settings object.";
            }

            const c = data.config;
            if (c === undefined) return null; // falls back to BASE_CONFIG

            if (!c || typeof c !== "object") return "config must be an object.";
            if (!c.grid || typeof c.grid !== "object") return "config.grid is missing.";
            if (!Array.isArray(c.widgets)) return "config.widgets must be an array.";
            if (!Array.isArray(c.shortcuts)) return "config.shortcuts must be an array.";
            if (c.theme && !themes[c.theme]) return `Unknown theme: ${c.theme}`;

            for (const w of c.widgets) {
                if (!WIDGETS[w.type]) return `Unknown widget type: ${w.type}`;
                if (!Array.isArray(w.pos) || !Array.isArray(w.size)) {
                    return `Widget "${w.type}" needs pos and size arrays.`;
                }
            }
            return null;
        }

        importButton.addEventListener("click", () => {
            let data;
            try {
                data = JSON.parse(importElem.value);
            } catch (e) {
                importMessage.textContent = "Invalid JSON: " + e.message;
                return;
            }

            const error = validateImport(data);
            if (error) {
                importMessage.textContent = error;
                return;
            }

            if (!confirm("Replace all current settings with the imported data?")) return;

            frozen = true; // stop background writes from clobbering the import
            localStorage.setItem(STATE_KEY, JSON.stringify(data));
            location.reload();
        });

        var grid = null;
        
        const searchEngines = {
            google: {
                name: "Google",
                search: { path: "https://www.google.com/search", searchParam: "q" },
                lucky: q => `https://www.google.com/search?q=${encodeURIComponent(q)}&btnI=1`
            },
            duckduckgo: {
                name: "DuckDuckGo",
                search: { path: "https://duckduckgo.com/", searchParam: "q" },
            },
            wikipedia: {
                name: "Wikipedia",
                search: { path: "https://en.wikipedia.org/w/index.php", searchParam: "search" },
                lucky: q => `https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(q)}&go=Go`
            },
            bing: {
                name: "Bing",
                search: {
                    path: "https://www.bing.com/search",
                    searchParam: "q"
                }
            },
            brave: {
                name: "Brave Search",
                search: {
                    path: "https://search.brave.com/search",
                    searchParam: "q"
                }
            },
            yahoo: {
                name: "Yahoo",
                search: {
                    path: "https://search.yahoo.com/search",
                    searchParam: "p"
                }
            },
            perplexity: {
                name: "Perplexity",
                search: {
                    path: "https://www.perplexity.ai/search",
                    searchParam: "q"
                }
            },
            youtube: {
                name: "YouTube",
                search: {
                    path: "https://www.youtube.com/results",
                    searchParam: "search_query"
                }
            },
            github: {
                name: "GitHub",
                search: {
                    path: "https://github.com/search",
                    searchParam: "q"
                }
            },
            stackoverflow: {
                name: "Stack Overflow",
                search: {
                    path: "https://stackoverflow.com/search",
                    searchParam: "q"
                }
            },
            reddit: {
                name: "Reddit",
                search: {
                    path: "https://www.reddit.com/search/",
                    searchParam: "q"
                }
            },
            amazon: {
                name: "Amazon",
                search: {
                    path: "https://www.amazon.com/s",
                    searchParam: "k"
                }
            },
            ebay: {
                name: "eBay",
                search: {
                    path: "https://www.ebay.com/sch/i.html",
                    searchParam: "_nkw"
                }
            },
            npm: {
                name: "npm",
                search: {
                    path: "https://www.npmjs.com/search",
                    searchParam: "q"
                }
            },
            mdn: {
                name: "MDN Web Docs",
                search: {
                    path: "https://developer.mozilla.org/en-US/search",
                    searchParam: "q"
                }
            }
        }

        const themes = {
            navy: "Navy",
            sunset: "Sunset",
            terminal: "Terminal",
            amberTerminal: "Amber Terminal"
        };

        var widgets = {};

        function setSpan(x, y, w, h, on) {
            var td = queryGrid(x, y);
            if (td) {
                td.colSpan = on ? w : 1;
                td.rowSpan = on ? h : 1;
            }

            for (var dx = 0; dx < w; dx++) {
                for (var dy = 0; dy < h; dy++) {
                    if (dx === 0 && dy === 0) continue;
                    var covered = queryGrid(x + dx, y + dy);
                    if (covered) covered.style.display = on ? "none" : "";
                }
            }
        }

        const STATE_KEY = "newerTabState";

        function loadState() {
            try {
                return JSON.parse(localStorage.getItem(STATE_KEY)) || {};
            } catch {
                return {};
            }
        }

        function exportState() {
            exportElem.value = JSON.stringify(state, null, 4);
        }

        // function saveState(s) {
        //     exportState();
        //     localStorage.setItem(STATE_KEY, JSON.stringify(s));
        // }

        function getPath(obj, path) {
            return path.split(".").reduce((o, k) => o?.[k], obj);
        }

        const listeners = new Map();

        function onPropChange(path, cb) {
            if (!listeners.has(path)) listeners.set(path, new Set());
            listeners.get(path).add(cb);
            return () => listeners.get(path)?.delete(cb);
        }

        function notify(oldSnap) {
            for (const [path, cbs] of listeners) {
                const oldVal = getPath(oldSnap, path);
                if (JSON.stringify(oldVal) === JSON.stringify(getPath(raw, path))) continue;

                const newVal = getPath(state, path);
                for (const cb of [...cbs]) cb(newVal, oldVal, path);
            }
        }

        const raw = loadState();
        let lastJSON = JSON.stringify(raw);
        let flushScheduled = false;

        let frozen = false;

        function flush() {
            if (frozen) return;
            flushScheduled = false;
            const json = JSON.stringify(raw);
            if (json === lastJSON) return;

            const oldSnap = JSON.parse(lastJSON);
            lastJSON = json;
            localStorage.setItem(STATE_KEY, json);
            exportState();
            notify(oldSnap);
        }

        function scheduleFlush() {
            if (flushScheduled) return;
            flushScheduled = true;
            queueMicrotask(flush);
        }

        function watch(obj) {
            return new Proxy(obj, {
                get(t, p, r) {
                    const v = Reflect.get(t, p, r);
                    return typeof v === "object" && v !== null ? watch(v) : v;
                },
                set(t, p, v, r) {
                    const ok = Reflect.set(t, p, v, r);
                    scheduleFlush();
                    return ok;
                },
                deleteProperty(t, p) {
                    const ok = Reflect.deleteProperty(t, p);
                    scheduleFlush();
                    return ok;
                }
            });
        }

        const state = watch(raw);

        exportState();

        window.addEventListener("storage", (e) => {
            if (e.key !== null && e.key !== STATE_KEY) return;

            const oldSnap = JSON.parse(lastJSON);
            const fresh = loadState();

            for (const k of Object.keys(raw)) delete raw[k];
            Object.assign(raw, fresh);

            lastJSON = JSON.stringify(raw);
            notify(oldSnap);
        });

        function canPlace(widget, x, y) {
            var gw = state.config.grid.width || 10;
            var gh = state.config.grid.height || 6;
            if (x < 0 || y < 0 || x + widget.width > gw || y + widget.height > gh) return false;

            for (var other of Object.values(widgets)) {
                if (other === widget || !other.el) continue;
                var overlaps =
                    x < other.x + other.width && x + widget.width > other.x &&
                    y < other.y + other.height && y + widget.height > other.y;
                if (overlaps) return false;
            }
            return true;
        }

        function setTableHighlight(v) {
            for (var i of grid.querySelectorAll("td")) {
                i.style.border = v ? "1px solid gray" : "none";
            }
        }

        function putWidgetAt(id, x, y) {
            var widget = widgets[id];
            if (!widget) return;
            if (!canPlace(widget, x, y)) return;

            if (widget.el) {
                setSpan(widget.x, widget.y, widget.width, widget.height, false);
            }

            var newTd = queryGrid(x, y);
            if (!newTd) return;

            setSpan(x, y, widget.width, widget.height, true);
            widget.x = x;
            widget.y = y;

            if (!widget.el) {
                var inner = document.createElement("div");
                inner.className = "widget-inner";
                inner.draggable = true;
                inner.dataset.widgetId = id;

                inner.addEventListener("dragstart", (event) => {
                    event.dataTransfer.setData("text/plain", id);
                    event.dataTransfer.effectAllowed = "move";
                    inner.style.opacity = "0.5";
                    setTableHighlight(true);
                });

                inner.addEventListener("dragend", () => {
                    inner.style.opacity = "";
                    setTableHighlight(false);
                });

                widget.el = inner;
            }

            newTd.appendChild(widget.el);
            return newTd;
        }

        function makeWidget(type, x = 0, y = 0, width = 2, height = 2) {
            var id = String(Math.round(Math.random() * (10 ** 12)));

            widgets[id] = { id, type, x, y, width, height, visible: true };

            var cell = putWidgetAt(id, x, y);

            return cell;
        }

        function addStyle(id, css) {
            if (document.getElementById(id)) return;
            const el = document.createElement("style");
            el.id = id;
            el.textContent = css;
            document.head.appendChild(el);
        }

                window.onSpotifyIframeApiReady = resolve;

        var cm = null;

        function hideContextMenu() {
            if (cm) {
                cm.remove();
                cm = null;
            }
        }

        function showContextMenu(options, x, y) {
            hideContextMenu();

            var menu = document.createElement("div");
            menu.style.cssText = `
                position: fixed;
                z-index: 100000;
                display: flex;
                flex-direction: column;
                background: var(--bg2);
                border: 1px solid var(--h1);
                border-radius: var(--borderRadius);
                overflow: hidden;
            `;

            for (const [label, handler] of options) {
                const item = document.createElement("button");
                item.innerHTML = label;
                item.style.cssText = `
                    background: transparent;
                    color: var(--font);
                    border: none;
                    padding: 8px 14px;
                    font: inherit;
                    text-align: left;
                    cursor: pointer;
                `;
                item.addEventListener("mouseenter", () => item.style.background = "var(--bg)");
                item.addEventListener("mouseleave", () => item.style.background = "transparent");
                item.addEventListener("click", () => {
                    handler();
                    hideContextMenu();
                });
                menu.appendChild(item);
            }

            document.querySelector("body").appendChild(menu);

            const r = menu.getBoundingClientRect();
            menu.style.left = Math.min(x, window.innerWidth - r.width) + "px";
            menu.style.top = Math.min(y, window.innerHeight - r.height) + "px";

            cm = menu;
        }

        document.addEventListener("pointerdown", (e) => {
            if (cm && !cm.contains(e.target)) hideContextMenu();
            if (settings && !settings.contains(e.target)) closeSettings();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") hideContextMenu();
            if (e.key === "Escape") closeSettings();
        });

        document.addEventListener("keydown", (e) => {
            if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key === "/") { e.preventDefault(); searchInput.focus(); }
            if (e.key === ",") openSettings();
        });

        window.addEventListener("blur", hideContextMenu);

            clock: (x, y, w, h) => {
                const SVG_NS = "http://www.w3.org/2000/svg";

                function makeClockHand(svg, length, width, color) {
                    var hand = document.createElementNS(SVG_NS, "line");
                    hand.setAttribute("x1", 50);
                    hand.setAttribute("y1", 50);
                    hand.setAttribute("x2", 50);
                    hand.setAttribute("y2", 50 - length);
                    hand.setAttribute("stroke", color);
                    hand.setAttribute("stroke-width", width);
                    hand.setAttribute("stroke-linecap", "round");
                    svg.appendChild(hand);
                    return hand;
                }

                var cell = makeWidget("clock", x, y, w, h);
                var inner = cell.querySelector(".widget-inner");

                var clockSvg = document.createElementNS(SVG_NS, "svg");
                clockSvg.setAttribute("viewBox", "0 0 100 100");
                clockSvg.style.width = "100%";
                clockSvg.style.height = "100%";

                clockSvg.style.color = "var(--font)";
                clockSvg.innerHTML = `<circle cx="50" cy="50" r="45" stroke-width="2"
                    style="fill: var(--bg); stroke: var(--h1)" />`;


                for (var i = 0; i < 12; i++) {
                    var tick = document.createElementNS(SVG_NS, "line");
                    tick.setAttribute("x1", 50);
                    tick.setAttribute("y1", 8);
                    tick.setAttribute("x2", 50);
                    tick.setAttribute("y2", i % 3 === 0 ? 14 : 11);
                    tick.setAttribute("stroke", "currentColor");
                    tick.setAttribute("stroke-width", i % 3 === 0 ? 2 : 1);
                    tick.setAttribute("transform", `rotate(${i * 30} 50 50)`);
                    clockSvg.appendChild(tick);
                }

                var hoursHand   = makeClockHand(clockSvg, 24, 3.5, "currentColor");
                var minutesHand = makeClockHand(clockSvg, 36, 2.5, "currentColor");
                var secondsHand = makeClockHand(clockSvg, 40, 1, "var(--select)");

                inner.appendChild(clockSvg);

                function updateClock() {
                    var now = new Date();
                    var s = now.getSeconds() + now.getMilliseconds() / 1000;
                    var m = now.getMinutes() + s / 60;
                    var h = (now.getHours() % 12) + m / 60;

                    secondsHand.setAttribute("transform", `rotate(${s * 6} 50 50)`);
                    minutesHand.setAttribute("transform", `rotate(${m * 6} 50 50)`);
                    hoursHand.setAttribute("transform", `rotate(${h * 30} 50 50)`);
                }
                updateClock();
                setInterval(updateClock, 100);

                return cell;
            },
            timer: (x, y, w, h) => {
                var cell = makeWidget("timer", x, y, w, h);
                var inner = cell.querySelector(".widget-inner");
                inner.style.display = "flex";
                inner.style.flexDirection = "column";
                inner.style.alignItems = "center";
                inner.style.justifyContent = "space-evenly";

                if (!state.timer) {
                    state.timer = { paused: true, timeLeft: 0, timeSet: "1:00" };
                }

                function formatTimeLeft(total) {
                    total = Math.max(0, Math.ceil(total));
                    var hrs = Math.floor(total / 3600);
                    var min = Math.floor(total / 60) % 60;
                    var sec = total % 60;
                    var pad = n => String(n).padStart(2, "0");

                    if (hrs > 0) return `${hrs}:${pad(min)}:${pad(sec)}`;
                    if (min > 0) return `${min}:${pad(sec)}`;
                    return `${sec}`;
                }

                function parseTime(t) {
                    var [s, m, h] = String(t).split(":").map(e => Number(e)).reverse();
                    return (s || 0) + (m || 0) * 60 + (h || 0) * 3600;
                }

                var buttons = document.createElement("div");
                buttons.style.display = "flex";
                buttons.style.flexDirection = "column";
                buttons.style.width = "100%";
                buttons.style.gap = "10px";

                var time = document.createElement("div");

                var startButton = document.createElement("button");
                startButton.style.flex = "1";

                var resetButton = document.createElement("button");
                resetButton.innerText = "Reset";
                resetButton.style.flex = "1";

                var timeInput = document.createElement("input");
                timeInput.placeholder = "1:00";

                function updateDisplay() {
                    startButton.innerText = state.timer.paused ? "Start" : "Pause";
                    startButton.hidden = !!state.timer.done;
                    resetButton.hidden = state.timer.timeLeft <= 0 && !state.timer.done;
                    timeInput.hidden = state.timer.timeLeft > 0 || !!state.timer.done;

                    var shown = state.timer.done
                        ? 0
                        : state.timer.timeLeft > 0
                            ? state.timer.timeLeft
                            : (parseTime(state.timer.timeSet) || 60);
                    time.textContent = formatTimeLeft(shown);
                }

                startButton.addEventListener("click", () => {
                    if (state.timer.timeLeft <= 0) state.timer.timeLeft = parseTime(state.timer.timeSet) || 60;
                    state.timer.paused = !state.timer.paused;
                    updateDisplay();
                });

                var beeping;

                resetButton.addEventListener("click", () => {
                    state.timer.done = false;
                    clearInterval(beeping);
                    state.timer.paused = true;
                    state.timer.timeLeft = 0;
                    updateDisplay();
                });

                timeInput.addEventListener("input", () => {
                    state.timer.timeSet = timeInput.value;
                    console.log(state.timer.timeSet);
                    updateDisplay();
                })

                var last = Date.now();
                setInterval(() => {
                    var now = Date.now();
                    var elapsed = (now - last) / 1000;
                    last = now;

                    if (state.timer.paused || state.timer.timeLeft <= 0) return;

                    var left = state.timer.timeLeft - elapsed;
                    if (left <= 0) {
                        state.timer.timeLeft = 0;
                        state.timer.paused = true;
                        state.timer.done = true;

                        clearInterval(beeping);
                        var count = 0;
                        beep();
                        beeping = setInterval(() => {
                            beep();
                            if (++count >= 20) clearInterval(beeping);
                        }, 500);
                    } else {
                        state.timer.timeLeft = left;
                    }
                }, 250);

                onPropChange("timer.timeLeft", updateDisplay);
                onPropChange("timer.paused", updateDisplay);
                onPropChange("timer.done", updateDisplay);
                onPropChange("timer.timeSet", () => {
                    timeInput.value = state.timer.timeSet;
                });

                buttons.appendChild(startButton);
                buttons.appendChild(resetButton);
                buttons.appendChild(timeInput);
                
                inner.appendChild(time);
                inner.appendChild(buttons);

                updateDisplay();
            },

                function makeCell(text) {

                function updateForecast(d) {
                    forecast.innerHTML = "<tr><th>Day</th><th>Hi</th><th>Lo</th><th>%</th></tr>";
                    forecast.style.fontSize = "13px";
                    forecast.style.borderCollapse = "collapse";

                    for (var day of d.forecast || []) {
                        var row = document.createElement("tr");

                        var name = new Date(day.date + "T00:00")
                            .toLocaleDateString("en-US", { weekday: "short" });

                        for (var i = 1; i < row.children.length; i++) {
                            row.children[i].style.textAlign = "right";
                            row.children[i].style.paddingLeft = "8px";
                        }

                        forecast.appendChild(row);
                    }
                }

                async function geocode(city) {
                    var [name, qualifier] = city.split(",").map(s => s.trim());
                    var url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=10&language=en&format=json`;

                    var res = await fetch(url);
                    if (!res.ok) throw new Error(`Geocoding failed: ${res.status}`);
                    var data = await res.json();
                    if (!data.results?.length) throw new Error(`No match for "${city}"`);

                    var q = qualifier?.toLowerCase();
                    var match = q
                        ? data.results.find(r =>
                            r.admin1?.toLowerCase().startsWith(q) ||
                            r.country_code?.toLowerCase() === q ||
                            r.country?.toLowerCase().startsWith(q))
                        : null;

                    return match || data.results[0];
                }

                 const WEATHER_CODES = {
                    0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
                    45: "Fog", 48: "Fog",
                    51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
                    61: "Light rain", 63: "Rain", 65: "Heavy rain",
                    71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
                    80: "Showers", 81: "Showers", 82: "Heavy showers",
                    85: "Snow showers", 86: "Heavy snow showers",
                    95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail"
                };

                function getPosition() {
                    return Promise.race([
                        new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(resolve, reject, {
                                maximumAge: 30 * 60 * 1000,
                                timeout: 10000
                            });
                        }),
                        new Promise((_, reject) =>
                            setTimeout(() => reject(new Error("geolocation timeout")), 8000))
                    ]);
                }

                const COORDS_MAX_AGE = 1 * 60 * 60 * 1000;
                const FAIL_COOLDOWN = 2 * 60 * 1000;
                const MAX_AGE = 10 * 60 * 1000;

                async function getIpPosition() {
                    var res = await fetch("https://get.geojs.io/v1/ip/geo.json");
                    if (!res.ok) throw new Error(`IP lookup failed: ${res.status}`);
                    var data = await res.json();
                    return { latitude: Number(data.latitude), longitude: Number(data.longitude) };
                }

                async function getCoords() {
                    var cached = state.weather.coords;
                    if (cached && Date.now() - cached.fetchedAt < COORDS_MAX_AGE) return cached;

                    var coords;
                    try {
                        var position = await getPosition();
                        coords = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            source: "gps"
                        };
                    } catch (error) {
                        console.warn(error.code === 1 ? "Location permission denied, using IP" : error);
                        coords = { ...(await getIpPosition()), source: "ip" };
                    }

                    coords.fetchedAt = Date.now();
                    state.weather.coords = coords;
                    return coords;
                }

                async function getWeather() {
                    try {
                        var { latitude, longitude, source } = await getCoords();

                        var params = new URLSearchParams({
                            latitude,
                            longitude,
                            current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m",
                            daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
                            temperature_unit: "fahrenheit",
                            wind_speed_unit: "mph",
                            timezone: "auto",
                            forecast_days: 5
                        });

                        var res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
                        if (!res.ok) throw new Error(`Forecast failed: ${res.status}`);
                        var data = await res.json();
                        var c = data.current;

                        var dd = data.daily;
                        var days = dd.time.map((date, i) => ({
                            date,
                            high: Math.round(dd.temperature_2m_max[i]),
                            low: Math.round(dd.temperature_2m_min[i]),
                            rain: dd.precipitation_probability_max[i],
                            condition: WEATHER_CODES[dd.weather_code[i]] || "Unknown"
                        }));


                        return {
                            latitude,
                            longitude,
                            source,
                            temp: Math.round(c.temperature_2m),
                            feelsLike: Math.round(c.apparent_temperature),
                            humidity: c.relative_humidity_2m,
                            wind: Math.round(c.wind_speed_10m),
                            condition: WEATHER_CODES[c.weather_code] || "Unknown",
                            forecast: days,
                            fetchedAt: Date.now()
                        };
                    } catch (error) {
                        console.warn(error);
                        return null;
                    }
                }

                var d = state.weather.data;

                },
                {
                    url: "https://youtube.com",
                },
                {
                    url: "https://mail.google.com",
                },
                {
                    url: "https://terra.hackclub.com",
                }
            ],
            theme: "sunset",
            grid: {
                width: 10,
                height: 5
            },
            widgets: [
                {
                    type: "clock",
                    pos: [0, 0],
                    size: [1, 1],
                },
                {
                    type: "timer",
                    pos: [1, 0],
                    size: [1, 1]
                },
                {
                    type: "weather",
                    pos: [0, 4],
                    size: [2, 1]
                },
                {
                    type: "notes",
                    pos: [0, 2],
                    size: [2, 2]
                },
                {
                    type: "todo",
                    pos: [8, 3],
                    size: [2, 2]
                },
                {
                    type: "spotify",
                    pos: [7, 0],
                    size: [3, 1]
                }
            ]
        }

        if (!state.config) state.config = BASE_CONFIG;

        var shortcuts = [];

        async function getWebsiteFavicon(u) {
            return `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(u)}&sz=32`;
        }

        async function initShortcuts() {
            for (var i of state.config.shortcuts) {
                var url = '';

                if (i.icon === 1 || (i.icon === undefined)) {
                    url = await getWebsiteFavicon(i.url);
                } else {
                    url = i.icon;
                }

                const s = document.createElement("div");
                s.className = "shortcut";

                if (!i.id) i.id = Math.round(Math.random() * (10 ** 12));
                
                s.dataset.id = i.id;

                s.addEventListener("contextmenu", (event) => {
                    event.preventDefault();
                    showContextMenu([
                        ["Remove", () => {
                            state.config.shortcuts = state.config.shortcuts.filter(e => e.id !== i.id);
                            location.reload();
                        }],
                    ], event.clientX, event.clientY);
                });

                const link = document.createElement("a");
                link.href = i.url;

                const image = document.createElement("img");
                image.width = 32;
                image.height = 32;
                image.src = url;

                link.appendChild(image);
                s.appendChild(link);

                shortcutsBox.appendChild(s);
            }

            var add = document.createElement("button");
            add.innerHTML = "&plus;"
            add.style.border = "none";
            add.style.background = "transparent";
            add.style.color = "var(--h1)";
            add.style.fontSize = "30px";
            add.classList.add("color-change-highlight");

            add.addEventListener("click", () => {
                var url = prompt("Enter a url: ");
                if (!url) return;
                state.config.shortcuts.push({ url: url, id: Math.round(Math.random() * (10 ** 12)) });
                location.reload();
            });
            
            shortcutsBox.appendChild(add);

        }

        searchEnginesSelect.addEventListener("change", () => {
            state.config.searchEngine = searchEnginesSelect.value;
            configSearch();
        });

        function configSearch() {
            const engine = searchEngines[searchEnginesSelect.value];
            searchForm.setAttribute("action", engine.search.path);
            searchInput.setAttribute("name", engine.search.searchParam);
            firstResultBtn.style.display = engine.lucky ? "" : "none";
        }

        function firstResult() {
            const q = searchInput.value.trim();
            if (!q) return;

            const engine = searchEngines[searchEnginesSelect.value];
            const lucky = engine.lucky || searchEngines.google.lucky;

            window.location.href = lucky(q);
        }

        function buildSearchUrl(q) {
            const cfg = searchEngines[searchEnginesSelect.value].search;
            const url = new URL(cfg.path);
            url.searchParams.set(cfg.searchParam, q);
            return url.toString();
        }

        function inNewTab() {
            const q = searchInput.value.trim();
            if (!q) return;

            window.open(buildSearchUrl(q), "_blank", "noopener");
        }

        function initSearch() {            
            for (var i of Object.keys(searchEngines)) {
                var option = document.createElement("option");
                option.textContent = searchEngines[i].name;
                option.value = i;

                searchEnginesSelect.appendChild(option);
            }

            searchEnginesSelect.value = state.config.searchEngine || "google";

            configSearch();

            searchInput.addEventListener("keydown", e => {
                if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    firstResult();
                }
            });
        }

        function initTheme() {
            document.documentElement.dataset.theme = state.config.theme || "navy";
        }

        function initGrid() {
            var { width, height } = state.config.grid;

            if (!width) width = 10;
            if (!height) height = 6;

            grid = document.createElement("table");
            grid.className = "widget-grid";

            for (var row = 0; row < height; row++) {
                const tr = document.createElement("tr");

                tr.style.height = `${100 / height}%`;

                for (var col = 0; col < width; col++) {
                    const td = document.createElement("td");

                    td.dataset.x = col;
                    td.dataset.y = row;

                    tr.appendChild(td);
                }

                grid.appendChild(tr);
            }

            console.log(grid);

            document.querySelector("body").appendChild(grid);

            function cellFrom(event) {
                return event.target.closest("td");
            }

            grid.addEventListener("dragover", (event) => {
                if (cellFrom(event)) event.preventDefault();
            });

            grid.addEventListener("drop", (event) => {
                var td = cellFrom(event);
                if (!td) return;
                event.preventDefault();

                var id = event.dataTransfer.getData("text/plain");
                var widget = widgets[id];
                if (!widget) return;

                var x = Number(td.dataset.x);
                var y = Number(td.dataset.y);
                if (Number.isNaN(x) || Number.isNaN(y)) return;

                var prevX = widget.x;
                var prevY = widget.y;

                if (!putWidgetAt(id, x, y)) return;

                var entry = state.config.widgets.find(c =>
                    c.type === widget.type && c.pos[0] === prevX && c.pos[1] === prevY
                );
                if (entry) entry.pos = [x, y];
            });

            for (var i of state.config.widgets) {
                try {
                    if (!WIDGETS[i.type]) console.warn("Invalid widget:", i.type);
                    WIDGETS[i.type](...(i.pos), ...(i.size));
                } catch (e) {
                    console.log(e.name);
                    console.warn("Failed to put down widget of type:", i.type, ". Error:", e);
                }
            }

            onPropChange("config.widgets", () => {
                location.reload();
            })
        }

        function queryGrid(x, y) {
            return grid?.children[y]?.children[x];
        }

        function ordinal(n) {
            const s = ["th", "st", "nd", "rd"];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        function updateTime() {
            const now = new Date();

            const hours = now.getHours() % 12 || 12;
            const minutes = String(now.getMinutes()).padStart(2, "0");
            bigTime.textContent = `${hours}:${minutes}`;

            weekDay.textContent =
                now.toLocaleDateString("en-US", { weekday: "long" });

            const month = now.toLocaleDateString("en-US", { month: "long" });
            dateReadable.textContent =
                `${month} ${ordinal(now.getDate())}`;

            const ampm = now.getHours() >= 12 ? "PM" : "AM";
            timeHalf.textContent = ampm;

            topTime.textContent = `${hours}:${minutes} ${ampm}`;

            dateNumbers.textContent =
                now.toLocaleDateString("en-US", { month: "numeric", day: "numeric", year: "2-digit" });
        }

        function openSettings() {
            settingsOverlay.hidden = false;
            settings.hidden = false;
        }
        
        function closeSettings() {
            settingsOverlay.hidden = true;
            settings.hidden = true;
        }

        function initSettingsMenu() {
            settingsButton.addEventListener("click", openSettings);

            for (const [key, name] of Object.entries(themes)) {
                const box = document.createElement("div");
                box.className = "themeSelectorTheme";
                box.dataset.theme = key;

                const swatch = document.createElement("div");
                swatch.className = "swatch";

                const label = document.createElement("span");
                label.textContent = name;

                box.append(swatch, label);
                box.addEventListener("click", () => {
                    state.config.theme = key;
                });

                themeSelector.appendChild(box);
            }

            function markSelected() {
                const current = state.config.theme || "navy";
                for (const box of themeSelector.children) {
                    box.classList.toggle("selected", box.dataset.theme === current);
                }
            }

            onPropChange("config.theme", () => {
                initTheme();
                markSelected();
            });
            markSelected();
        }

        initTheme();
        initGrid();
        initSearch();
        initShortcuts();
        initSettingsMenu();

        setInterval(updateTime, 500);
        updateTime();
    </script>
</body>
</html>
